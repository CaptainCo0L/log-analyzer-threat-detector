[project]
name = "pihole-detector"
version = "0.1.0"
description = "Real-time DNS threat detection on top of the Pi-hole v6 API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff's defaults (pyflakes and the pycodestyle errors); set here so a personal ruff config can't widen them.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests import next to the section that uses them, and use one-line lambdas as fakes.
"tests/*" = ["E402", "E731"]

[tool.mypy]
mypy_path = "src"
packages = ["pihole_detector"]
